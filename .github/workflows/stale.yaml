name: Close inactive pull requests

on:
  schedule:
    # Run daily at 1:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          # PR configuration: mark stale after 15 days, close after additional 15 days
          days-before-pr-stale: 15
          days-before-pr-close: 15
          stale-pr-label: "stale"
          stale-pr-message: "This pull request is stale because it has been open for 15 days with no activity."
          close-pr-message: "This pull request was closed because it has been inactive for 15 days since being marked as stale."

          # Disable issue handling (PRs only)
          days-before-issue-stale: -1
          days-before-issue-close: -1
