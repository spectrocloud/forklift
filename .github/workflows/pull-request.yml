  # Job 2: Unit tests with coverage (runs in parallel)
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.6'
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests with coverage
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./_build/cov/coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  # Code coverage report (runs after test completes) - REMOVED, now part of test job

  # Job 3: Verify code generation (runs in parallel)
  verify:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.6'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify tidy
        run: |
          make tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)

      - name: Verify vendor
        run: |
          make vendor
          git diff --exit-code vendor/ || (echo "vendor/ is not up to date" && exit 1)

      - name: Verify generated code
        run: make generate-verify

  # Job 4: Build binaries (runs in parallel)
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.6'
          cache: true
          cache-dependency-path: go.sum

      - name: Build controller
        run: make forklift-controller

  # Job 5: Guest scripts tests (runs in parallel)
  guest_scripts:
    name: Guest Scripts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash

          - os: ubuntu-latest
            shell: dash

    runs-on: ${{ matrix.os }}
    timeout-minutes: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Test network config utility
        run: ${{ matrix.shell }} ./pkg/virt-v2v/customize/scripts/rhel/run/test-network_config_util.sh

