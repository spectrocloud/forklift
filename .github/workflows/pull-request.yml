# Comprehensive CI workflow for pull requests
name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch and spectro-v* branches
  pull_request:
    branches: 
      - main
      - 'spectro-v*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Run jobs in parallel for faster execution
