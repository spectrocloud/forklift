# SonarQube Project Configuration
sonar.projectKey=forklift
sonar.organization=spectrocloud

# This is the name and version displayed in the SonarQube UI.
sonar.projectName=forklift
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Exclude directories
sonar.exclusions=**/vendor/**,**/node_modules/**,**/*_test.go,**/tests/**,**/test/**,**/*.pb.go

# Test coverage
sonar.go.coverage.reportPaths=_build/cov/coverage.out

# External linter reports (golangci-lint)
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

# Go specific settings
sonar.language=go
sonar.sourceEncoding=UTF-8

# Test sources (optional, helps SonarQube identify test files)
sonar.tests=.
sonar.test.inclusions=**/*_test.go
